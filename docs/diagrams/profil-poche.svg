<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1200" width="1000" height="1200" font-family="Helvetica,Arial,sans-serif" font-size="13">
<defs><pattern id="h" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="6" height="6" fill="#d9dde3"/><line x1="0" y1="0" x2="0" y2="6" stroke="#9aa3ad" stroke-width="1.5"/></pattern><pattern id="h2" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="6" height="6" fill="#efe6d6"/><line x1="0" y1="0" x2="0" y2="6" stroke="#c2a878" stroke-width="1.5"/></pattern></defs>
<rect width="1000" height="1200" fill="#ffffff"/>
<text x="500" y="28" text-anchor="middle" fill="#111" font-weight="bold" font-size="18">Poche de baseplate : coupe du muret entre deux cellules (échelle 1 mm = 45 px)</text>
<text x="250" y="60" text-anchor="middle" fill="#111" font-weight="bold" font-size="15">Gridfinity – spec gridfinity.xyz = rebuilt</text>
<text x="750" y="60" text-anchor="middle" fill="#111" font-weight="bold" font-size="15">Gridfinity – extrabold.tools (Normal, sans aimants, mesuré)</text>
<line x1="60" y1="330" x2="450" y2="330" stroke="#555" stroke-dasharray="2 3"/>
<text x="60" y="348" text-anchor="start" fill="#555" font-weight="normal" font-size="13">dessous de la baseplate (z = 0)</text>
<line x1="560" y1="330" x2="950" y2="330" stroke="#555" stroke-dasharray="2 3"/>
<text x="560" y="348" text-anchor="start" fill="#555" font-weight="normal" font-size="13">dessous de la baseplate (z = 0)</text>
<polygon points="121.75,330.00 121.75,314.25 153.25,282.75 153.25,201.75 250.00,105.00 346.75,201.75 346.75,282.75 378.25,314.25 378.25,330.00" fill="url(#h)" stroke="#111" stroke-width="2"/>
<polygon points="621.75,330.00 653.25,298.50 653.25,217.50 732.00,138.75 768.00,138.75 846.75,217.50 846.75,298.50 878.25,330.00" fill="url(#h)" stroke="#111" stroke-width="2"/>
<polyline points="732.00,138.75 750.00,120.75 768.00,138.75" fill="none" stroke="#d62828" stroke-width="2" stroke-dasharray="4 3"/>
<polyline points="261.25,82.50 261.25,116.25 358.00,213.00 358.00,294.00 394.00,330.00 425.50,330.00" fill="none" stroke="#1d4ed8" stroke-width="2.5" stroke-dasharray="7 4"/>
<polyline points="761.25,98.25 761.25,132.00 858.00,228.75 858.00,309.75 894.00,345.75 925.50,345.75" fill="none" stroke="#1d4ed8" stroke-width="2.5" stroke-dasharray="7 4"/>
<text x="240" y="100" text-anchor="end" fill="#111" font-weight="normal" font-size="13">arête vive (z = 5,00)</text>
<text x="272" y="84" text-anchor="start" fill="#1d4ed8" font-weight="bold" font-size="13">pied du bac</text>
<text x="185" y="150" text-anchor="end" fill="#111" font-weight="normal" font-size="13">45° · 2,15 mm</text>
<text x="145" y="245" text-anchor="end" fill="#111" font-weight="normal" font-size="13">vertical · 1,8 mm</text>
<text x="140" y="292" text-anchor="end" fill="#111" font-weight="normal" font-size="13">45° · 0,7 mm</text>
<text x="116" y="306" text-anchor="end" fill="#b45309" font-weight="bold" font-size="13">+0,35 mm de</text>
<text x="116" y="321" text-anchor="end" fill="#b45309" font-weight="bold" font-size="13">muret vertical</text>
<text x="250" y="380" text-anchor="middle" fill="#111" font-weight="normal" font-size="13">Hauteur 5,00 mm = profil 4,65 + muret vertical de 0,35 (pas un vide).</text>
<text x="250" y="398" text-anchor="middle" fill="#111" font-weight="normal" font-size="13">Le pied du bac s’appuie sur les chanfreins 45° ;</text>
<text x="250" y="416" text-anchor="middle" fill="#111" font-weight="normal" font-size="13">son dessous arrive pile au niveau du dessous de la plaque.</text>
<text x="685" y="150" text-anchor="end" fill="#111" font-weight="normal" font-size="13">45° · 2,15 mm</text>
<text x="645" y="245" text-anchor="end" fill="#111" font-weight="normal" font-size="13">vertical · 1,8 mm</text>
<text x="640" y="315" text-anchor="end" fill="#111" font-weight="normal" font-size="13">45° · 0,7 mm</text>
<text x="735" y="128" text-anchor="end" fill="#d62828" font-weight="bold" font-size="13">pointe rabotée 0,4 mm</text>
<text x="772" y="98" text-anchor="start" fill="#1d4ed8" font-weight="bold" font-size="13">pied du bac</text>
<text x="905" y="362" text-anchor="middle" fill="#b45309" font-weight="bold" font-size="13">dépasse de 0,35 mm</text>
<text x="750" y="380" text-anchor="middle" fill="#111" font-weight="normal" font-size="13">Hauteur 4,25 mm = profil 4,65 − rabotage 0,4, sans muret de 0,35.</text>
<text x="750" y="398" text-anchor="middle" fill="#111" font-weight="normal" font-size="13">Pour s’appuyer sur les chanfreins, le pied devrait descendre</text>
<text x="750" y="416" text-anchor="middle" fill="#111" font-weight="normal" font-size="13">0,35 mm sous la plaque : il touche le fond du tiroir.</text>
<line x1="40" y1="440" x2="960" y2="440" stroke="#ccc"/>
<text x="500" y="470" text-anchor="middle" fill="#111" font-weight="bold" font-size="15">ModuBOX (Alexandre Chappel) – grille 55 mm, système différent et incompatible</text>
<line x1="0" y1="720" x2="600" y2="720" stroke="#555" stroke-dasharray="2 3"/>
<text x="10" y="756" text-anchor="start" fill="#555" font-weight="normal" font-size="13">fond du tiroir (z = 0)</text>
<text x="555" y="602" text-anchor="end" fill="#1d4ed8" font-weight="bold" font-size="13">2 cellules</text>
<polygon points="93.00,720.00 300.00,513.00 507.00,720.00" fill="url(#h2)" stroke="#8a6d3b" stroke-width="2" stroke-dasharray="6 3"/>
<polyline points="30.00,499.50 30.00,720.00 75.00,720.00 300.00,495.00 525.00,720.00 570.00,720.00 570.00,499.50" fill="none" stroke="#1d4ed8" stroke-width="2.5" stroke-dasharray="7 4"/>
<text x="360" y="738" text-anchor="middle" fill="#8a6d3b" font-weight="bold" font-size="13">hachuré : nervure de BaseGrid [déduite, non mesurée]</text>
<text x="395" y="600" text-anchor="start" fill="#1d4ed8" font-weight="normal" font-size="13">45°</text>
<text x="205" y="600" text-anchor="end" fill="#1d4ed8" font-weight="normal" font-size="13">45°</text>
<text x="45" y="570" text-anchor="start" fill="#1d4ed8" font-weight="bold" font-size="13">bac : pied plat</text>
<text x="45" y="586" text-anchor="start" fill="#1d4ed8" font-weight="bold" font-size="13">sous chaque cellule</text>
<text x="555" y="570" text-anchor="end" fill="#1d4ed8" font-weight="bold" font-size="13">rainure en V</text>
<text x="555" y="586" text-anchor="end" fill="#1d4ed8" font-weight="bold" font-size="13">de 5 mm entre</text>
<text x="610" y="490" text-anchor="start" fill="#111" font-weight="normal" font-size="13"><tspan font-weight='bold'>Mesuré</tspan> sur une base « compatible » communautaire</text>
<text x="610" y="509" text-anchor="start" fill="#111" font-weight="normal" font-size="13">(Pascal Lieverse, Printables, CC BY) : pied à 45° simple,</text>
<text x="610" y="528" text-anchor="start" fill="#111" font-weight="normal" font-size="13">haut de 4,5 mm, rainure en V de 5 mm entre les cellules,</text>
<text x="610" y="547" text-anchor="start" fill="#111" font-weight="normal" font-size="13">≈ 0,4 mm de jeu par côté.</text>
<text x="610" y="566" text-anchor="start" fill="#111" font-weight="normal" font-size="13"></text>
<text x="610" y="585" text-anchor="start" fill="#111" font-weight="normal" font-size="13"><tspan font-weight='bold'>Officiel</tspan> (images d’alch.shop) : BaseGrid ajourée,</text>
<text x="610" y="604" text-anchor="start" fill="#111" font-weight="normal" font-size="13">nervures chanfreinées des deux côtés. Aucune cote publiée,</text>
<text x="610" y="623" text-anchor="start" fill="#111" font-weight="normal" font-size="13">fichiers payants (non achetés).</text>
<text x="610" y="642" text-anchor="start" fill="#111" font-weight="normal" font-size="13"></text>
<text x="610" y="661" text-anchor="start" fill="#111" font-weight="normal" font-size="13"><tspan font-weight='bold'>Différences avec Gridfinity</tspan> : pas de 55 mm (vs 42),</text>
<text x="610" y="680" text-anchor="start" fill="#111" font-weight="normal" font-size="13">unité de hauteur de 18 mm (vs 7), chanfrein 45° simple</text>
<text x="610" y="699" text-anchor="start" fill="#111" font-weight="normal" font-size="13">au lieu du profil étagé 0,7 / 1,8 / 2,15.</text>
<text x="610" y="718" text-anchor="start" fill="#111" font-weight="normal" font-size="13">Le bac repose à plat sur le fond ; la nervure ne fait</text>
<text x="610" y="737" text-anchor="start" fill="#111" font-weight="normal" font-size="13">que le positionner.</text>
<line x1="40" y1="780" x2="960" y2="780" stroke="#ccc"/>
<text x="500" y="808" text-anchor="middle" fill="#111" font-weight="bold" font-size="16">Gridfinity, vue de dessus d’une cellule 42 × 42 mm : trous d’aimants (échelle 1 mm = 5 px)</text>
<rect x="90" y="825" width="210" height="210" rx="20" fill="#eef1f4" stroke="#111" stroke-width="1.5"/>
<rect x="104.25" y="839.25" width="181.5" height="181.5" rx="5.75" fill="#fff" stroke="#888"/>
