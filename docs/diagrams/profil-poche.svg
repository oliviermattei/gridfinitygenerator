<circle cx="195" cy="930" r="2.5" fill="#d62828"/>
<text x="195" y="1060" text-anchor="middle" fill="#111" font-weight="normal" font-size="13">Spec / rebuilt : Ø 6,5 × 2,4 mm</text>
<text x="195" y="1078" text-anchor="middle" fill="#111" font-weight="normal" font-size="13">à 13 mm du centre (axes x et y)</text>
<rect x="390" y="825" width="210" height="210" rx="20" fill="#eef1f4" stroke="#111" stroke-width="1.5"/>
<rect x="404.25" y="839.25" width="181.5" height="181.5" rx="5.75" fill="#fff" stroke="#888"/>
<circle cx="425" cy="860" r="15.5" fill="#374151"/>
<circle cx="430" cy="865" r="15" fill="none" stroke="#1d4ed8" stroke-width="2" stroke-dasharray="4 3"/>
<circle cx="425" cy="1000" r="15.5" fill="#374151"/>
<circle cx="430" cy="995" r="15" fill="none" stroke="#1d4ed8" stroke-width="2" stroke-dasharray="4 3"/>
<circle cx="565" cy="860" r="15.5" fill="#374151"/>
<circle cx="560" cy="865" r="15" fill="none" stroke="#1d4ed8" stroke-width="2" stroke-dasharray="4 3"/>
<circle cx="565" cy="1000" r="15.5" fill="#374151"/>
<circle cx="560" cy="995" r="15" fill="none" stroke="#1d4ed8" stroke-width="2" stroke-dasharray="4 3"/>
<line x1="495" y1="930" x2="565" y2="1000" stroke="#d62828" stroke-width="1.5"/>
<circle cx="495" cy="930" r="2.5" fill="#d62828"/>
<text x="495" y="1060" text-anchor="middle" fill="#111" font-weight="normal" font-size="13">extrabold : Ø 6,2 × 2 mm</text>
<text x="495" y="1078" text-anchor="middle" fill="#111" font-weight="normal" font-size="13">à 14 mm du centre [mesuré sur export]</text>
<text x="495" y="1096" text-anchor="middle" fill="#111" font-weight="normal" font-size="13">pointillés bleus = aimant du bac (13 mm)</text>
<text x="830" y="840" text-anchor="middle" fill="#111" font-weight="bold" font-size="13">Nervures de serrage (crush ribs)</text>
<circle cx="830" cy="930" r="50.25" fill="#eef1f4" stroke="#111" stroke-width="1.5"/>
<polygon points="870.9,946.9 879.0,941.6 872.9,956.5" fill="#374151"/>
<polygon points="846.9,970.9 856.5,972.9 841.6,979.0" fill="#374151"/>
<polygon points="813.1,970.9 818.4,979.0 803.5,972.9" fill="#374151"/>
<polygon points="789.1,946.9 787.1,956.5 781.0,941.6" fill="#374151"/>
<polygon points="789.1,913.1 781.0,918.4 787.1,903.5" fill="#374151"/>
<polygon points="813.1,889.1 803.5,887.1 818.4,881.0" fill="#374151"/>
<polygon points="846.9,889.1 841.6,881.0 856.5,887.1" fill="#374151"/>
<polygon points="870.9,913.1 872.9,903.5 879.0,918.4" fill="#374151"/>
<circle cx="830" cy="930" r="45" fill="none" stroke="#1d4ed8" stroke-width="2" stroke-dasharray="5 3"/>
<text x="830" y="1005" text-anchor="middle" fill="#111" font-weight="normal" font-size="13">Trou plus large que l’aimant (pointillés),</text>
<text x="830" y="1023" text-anchor="middle" fill="#111" font-weight="normal" font-size="13">8 petites arêtes qui s’écrasent à l’insertion</text>
<text x="830" y="1041" text-anchor="middle" fill="#111" font-weight="normal" font-size="13">→ l’aimant tient serré, sans colle.</text>
<text x="500" y="1188" text-anchor="middle" fill="#666" font-weight="normal" font-size="12">Sources : docs/research/gridfinity-baseplate.md (B, C) et modbox-alexandre-chappel.md. Hachuré = matière. Bleu pointillé = bac.</text>
</svg>