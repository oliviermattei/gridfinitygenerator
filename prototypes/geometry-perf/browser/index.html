<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <title>PROTOTYPE geometry-perf (navigateur)</title>
  </head>
  <body>
    <h1>PROTOTYPE JETABLE : bench Web Worker</h1>
    <p id="state">en cours…</p>
    <pre id="out"></pre>
    <script type="module">
      const out = document.getElementById('out');
      const rows = [];
      const w = new Worker(new URL('./worker.js', import.meta.url), { type: 'module' });
      w.onmessage = (e) => {
        if (e.data.done) {
          document.getElementById('state').textContent = 'terminé';
          window.__results = rows;
          return;
        }
        rows.push(e.data);
        out.textContent += JSON.stringify(e.data) + '\n';
      };
    </script>
  </body>
</html>
